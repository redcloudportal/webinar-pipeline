# Its OWN compose project (webinar-pipeline), its own folder on the server
# (/root/webinar-pipeline), its own repo. A portal deploy cannot touch it.
#
# It joins the portal's network ONLY so the shared HTTPS front door (Caddy, which
# lives in the portal's setup) can route to it. Caddy builds ONE config from every
# container's labels, so a label that fails can disturb HTTPS for every site on
# the box — after changing the labels below, check `docker logs portal-caddy-1`
# and that the portal, HQ and CRM still load. See PROJECT.md.
name: webinar-pipeline
services:
  pipeline:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["8300"]
    mem_limit: 768m        # the graphics run draws 2500x4534 posters
    networks: [portal_default]
    volumes: ["pipeline-data:/data"]   # the sign-in password hash lives here
    environment:
      PUBLIC_URL: https://webinars.redcloudfs.com
      # LIVE since the cut-over (2 Oct 2026): the connectors run, the 15-minute timer
      # is on. Set PAUSED "1" to stop everything outward at once (see CUTOVER.md).
      PAUSED: "0"
      SCHEDULER_ENABLED: "1"
    labels:
      caddy: webinars.redcloudfs.com
      caddy.reverse_proxy: "{{upstreams 8300}}"
volumes:
  pipeline-data:
networks:
  portal_default:
    external: true
